[project]
name = "dsos"
version = "0.1.0"
description = "DS Artifact OS — the working-layer artifact store for agent-driven analysis"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "pandas>=2.2",
    "fastmcp>=0.4",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "markdown>=3.6",
]

[project.optional-dependencies]
# Real semantic embeddings. Optional: embeddings.py falls back to a
# dependency-free hashing embedding if this isn't installed, so layer 1
# works with zero network/model downloads. Install this when you want
# actual semantic search quality.
embeddings = ["sentence-transformers>=3.0"]
dev = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["dsos*"]
