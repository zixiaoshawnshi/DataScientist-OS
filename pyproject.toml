[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsos"
version = "0.5.0"
description = "DS Artifact OS — the working-layer artifact store for agent-driven analysis"
requires-python = ">=3.11"
dependencies = [
    # Storage/MCP plumbing only — the server process itself never execs
    # user code (see dsos/sandbox.py), so it has no need for the analysis
    # stack run_python code imports. That stack is the `analysis` extra
    # below, for the interpreter run_python actually targets.
    "duckdb>=1.0",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "pandas>=2.2",
    # 4.0 is the floor because dsos/daemon.py depends on 4.x APIs that
    # earlier releases do not have: StaticTokenVerifier imported from
    # fastmcp.server.auth.providers.jwt, and an http_app whose mounted
    # lifespan the daemon composes into its own (WP-D1).
    "fastmcp>=4.0",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "markdown>=3.6",
]

[project.optional-dependencies]
# Real semantic embeddings. Optional: embeddings.py falls back to a
# dependency-free hashing embedding if this isn't installed, so layer 1
# works with zero network/model downloads. Install this when you want
# actual semantic search quality.
embeddings = ["sentence-transformers>=3.0"]
dev = ["httpx>=0.27"]
# The standard analysis stack run_python code is expected to import — not
# a server dependency, since run_python always runs in a subprocess against
# a configured python_path (DSOS_PYTHON_PATH), never this process. Install
# this into whatever interpreter you point python_path at (often this same
# venv, for local dev/test). matplotlib is needed for output_type="chart"
# (png bytes) to work at all; scipy/sklearn/statsmodels were the exact gaps
# that blocked a real analysis session (feedback #1: hand-written
# Newton-Raphson logistic regression "crashed 4 times before converging").
analysis = [
    "matplotlib>=3.8",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
]

[tool.setuptools.packages.find]
include = ["dsos*"]

# Built-in chart styles, report templates, and the GUI's Jinja templates —
# non-.py package assets resolved by name/path at runtime (dsos/templating.py,
# dsos/gui.py). Without this they silently vanish from a real build (editable
# installs hide the bug — that's why the release process verifies with one).
[tool.setuptools.package-data]
dsos = ["assets/chartstyles/*.mplstyle", "assets/reports/*.html", "templates/*.html"]
