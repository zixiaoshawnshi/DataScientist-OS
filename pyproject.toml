[project]
name = "dsos"
version = "0.1.0"
description = "DS Artifact OS — the working-layer artifact store for agent-driven analysis"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "pandas>=2.2",
    "fastmcp>=0.4",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "markdown>=3.6",
    # The standard analysis stack run_python is expected to have. matplotlib
    # is required for output_type="chart" (png bytes) to work at all;
    # scipy/sklearn/statsmodels were the exact gaps that blocked a real
    # analysis session (feedback #1: hand-written Newton-Raphson logistic
    # regression "crashed 4 times before converging").
    "matplotlib>=3.8",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
# Real semantic embeddings. Optional: embeddings.py falls back to a
# dependency-free hashing embedding if this isn't installed, so layer 1
# works with zero network/model downloads. Install this when you want
# actual semantic search quality.
embeddings = ["sentence-transformers>=3.0"]
dev = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["dsos*"]

# Built-in chart styles and report templates — package assets resolved by
# name (see dsos/templating.py). Without this they'd silently vanish from
# real installs (editable installs hide the bug).
[tool.setuptools.package-data]
dsos = ["assets/chartstyles/*.mplstyle", "assets/reports/*.html"]
