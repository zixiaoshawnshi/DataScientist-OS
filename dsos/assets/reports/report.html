<!doctype html>
<!-- DSOS house report layout (the default for publish_report) — dark mode,
     matching the default dark chart style so embedded charts look native.
     Tokens (see dsos/templating.py): title, body, published_at,
     session_question — substituted literally, body LAST and never
     re-scanned, so tokens and artifact embeds inside the rendered
     narrative stay untouched. (Token spellings are deliberately not
     written out in this comment: they would themselves be substituted
     into the published file.) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  :root {
    --ink: #dce3ed; --muted: #97a1b1; --line: #262f3d; --accent: #89b4f7;
    --bg: #10151d; --panel: #171e28;
  }
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: var(--bg); color: var(--ink);
    max-width: 860px; margin: 0 auto; padding: 0 1.5rem 3rem; line-height: 1.65;
  }
  header.report-header {
    border-bottom: 3px solid var(--accent); margin: 2.5rem 0 2rem; padding-bottom: 1.25rem;
  }
  header.report-header .eyebrow {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; margin: 0 0 0.4rem;
  }
  header.report-header h1 { font-size: 2rem; margin: 0 0 0.5rem; line-height: 1.25; }
  header.report-header .meta {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.8rem; color: var(--muted); margin: 0;
  }
  article { font-size: 1.02rem; }
  h1, h2, h3, h4 { font-weight: 700; }
  h2 { border-bottom: 1px solid var(--line); padding-bottom: 0.3rem; }
  a { color: var(--accent); }
  .dsos-embed {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 1rem 1.1rem; margin: 1.75rem 0;
    background: var(--panel);
  }
  .dsos-embed h4 {
    margin: 0 0 0.75rem; color: var(--muted); font-size: 0.72rem;
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
  }
  table.dsos-table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
  table.dsos-table th, table.dsos-table td {
    padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--line); text-align: left;
  }
  table.dsos-table th { color: var(--muted); font-weight: 600; }
  img { max-width: 100%; border-radius: 6px; border: 1px solid var(--line); }
  pre {
    font-family: ui-monospace, Consolas, "Courier New", monospace;
    background: #0b0f15; color: #cdd6e4; padding: 1rem;
    border-radius: 8px; overflow-x: auto; font-size: 0.85rem;
  }
  blockquote { border-left: 3px solid var(--line); margin: 1.25rem 0; padding: 0.25rem 1.25rem; color: var(--muted); }
  footer.report-footer {
    border-top: 1px solid var(--line); margin-top: 3rem; padding-top: 0.9rem;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.75rem; color: var(--muted);
  }
</style>
</head>
<body>
<header class="report-header">
  <p class="eyebrow">Analysis report</p>
  <h1>{{title}}</h1>
  <p class="meta">
    Question: {{session_question}}<br>
    Published {{published_at}} · DS Artifact OS
  </p>
</header>
<article>
{{body}}
</article>
<footer class="report-footer">
  Generated by DS Artifact OS from versioned, lineage-tracked artifacts.
  Every table and figure above is a verbatim rendering of a stored artifact,
  not a copy of its numbers.
</footer>
</body>
</html>
