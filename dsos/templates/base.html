<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Resolve the theme before first paint (no light flash): stored choice
    // wins, otherwise follow the OS preference. Sets <html data-theme>.
    (function () {
      var t = null;
      try { t = localStorage.getItem("dsos-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = t;
    })();
    function dsosToggleTheme() {
      var root = document.documentElement;
      var next = root.dataset.theme === "dark" ? "light" : "dark";
      root.dataset.theme = next;
      try { localStorage.setItem("dsos-theme", next); } catch (e) {}
      var label = document.getElementById("dsos-theme-label");
      if (label) label.textContent = next === "dark" ? "☀ Light mode" : "🌙 Dark mode";
    }
  </script>
  <title>{% block title %}DS Artifact OS{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #fafafa; --fg: #1a1a1a;
      --sidebar-bg: #fff; --border: #ddd; --td-border: #eee;
      --row-hover: #f5f5f7;
      --link: #2563eb; --link-hover: #2563eb;
      --muted: #888; --th: #666; --h2: #333;
      --reuse-bg: #dcfce7; --reuse-fg: #166534;
      --type-bg: #e0e7ff; --type-fg: #3730a3;
      --input-bg: #fff; --input-border: #ccc;
      --tab-fg: #666; --active-tab: #1a1a1a;
      --pre-bg: #0f172a; --pre-fg: #e2e8f0;
      --img-border: #eee;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f1115; --fg: #e6e6e6;
      --sidebar-bg: #161a22; --border: #2a2f3a; --td-border: #232833;
      --row-hover: #1b2029;
      --link: #7aa2f7; --link-hover: #93b4ff;
      --muted: #8b93a1; --th: #8b93a1; --h2: #cfd4de;
      --reuse-bg: #143524; --reuse-fg: #7ee2a8;
      --type-bg: #232c4d; --type-fg: #a5b4fc;
      --input-bg: #11141a; --input-border: #3a4150;
      --tab-fg: #8b93a1; --active-tab: #e6e6e6;
      --pre-bg: #0b0f18; --pre-fg: #e2e8f0;
      --img-border: #2a2f3a;
    }
    body {
      font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0; background: var(--bg); color: var(--fg);
    }
    .shell { display: flex; min-height: 100vh; }
    nav.sidebar {
      width: 200px; flex: 0 0 200px; border-right: 1px solid var(--border);
      background: var(--sidebar-bg);
      padding: 1.25rem 1rem; box-sizing: border-box;
    }
    nav.sidebar a.brand {
      display: block; color: var(--fg); text-decoration: none; font-weight: 600;
      margin-bottom: 1.25rem;
    }
    nav.sidebar .group { margin-bottom: 1.25rem; }
    nav.sidebar .group h3 {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--muted); margin: 0 0 0.4rem;
    }
    nav.sidebar a {
      display: block; padding: 0.3rem 0; color: var(--fg); text-decoration: none; font-size: 0.9rem;
    }
    nav.sidebar a:hover { color: var(--link-hover); }
    main { flex: 1; padding: 1.5rem 2rem; max-width: 960px; box-sizing: border-box; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.05rem; margin-top: 2rem; color: var(--h2); }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--td-border); vertical-align: top; }
    th { color: var(--th); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; }
    tr:hover { background: var(--row-hover); }
    a { color: var(--link); }
    .badge {
      display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px;
      font-size: 0.75rem; font-weight: 600; white-space: nowrap;
    }
    .badge-reuse { background: var(--reuse-bg); color: var(--reuse-fg); }
    .badge-type { background: var(--type-bg); color: var(--type-fg); }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .filters { display: flex; gap: 0.6rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .filters input, .filters select, .filters button {
      padding: 0.4rem 0.6rem; border: 1px solid var(--input-border); border-radius: 6px;
      font-size: 0.9rem; background: var(--input-bg); color: var(--fg);
    }
    pre {
      background: var(--pre-bg); color: var(--pre-fg); padding: 1rem; border-radius: 8px;
      overflow-x: auto; white-space: pre-wrap; word-break: break-word;
    }
    .feed-item { border-left: 3px solid var(--link); padding-left: 0.75rem; margin-bottom: 0.75rem; }
    .crumbs { margin-bottom: 1rem; }
    img { max-width: 100%; border-radius: 8px; border: 1px solid var(--img-border); }
    .tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid var(--border); margin: 1rem 0 1.5rem; }
    .tabs button {
      background: none; border: none; padding: 0.5rem 0.9rem; font-size: 0.9rem;
      cursor: pointer; color: var(--tab-fg); border-bottom: 2px solid transparent;
    }
    .tabs button.active { color: var(--active-tab); border-bottom-color: var(--link); font-weight: 600; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .theme-toggle { margin-top: 1.5rem; font-size: 0.85rem; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="shell">
    <nav class="sidebar">
      <a class="brand" href="/">DS Artifact OS</a>
      <div class="group">
        <h3>Browse</h3>
        <a href="/">Sessions</a>
        <a href="/artifacts">All artifacts</a>
      </div>
      <div class="group">
        <h3>By type</h3>
        {% for t in ["dataset", "query", "transform", "chart", "narrative", "skill", "template"] %}
        <a href="/artifacts?type={{ t }}">{{ t }}</a>
        {% endfor %}
      </div>
      <a class="theme-toggle" href="#" onclick="dsosToggleTheme(); return false">
        <span id="dsos-theme-label">Toggle theme</span>
      </a>
    </nav>
    <main>{% block content %}{% endblock %}</main>
  </div>
  <script>
    // Label reflects the resolved theme (the head script ran before this).
    (function () {
      var label = document.getElementById("dsos-theme-label");
      if (label) {
        label.textContent =
          document.documentElement.dataset.theme === "dark" ? "☀ Light mode" : "🌙 Dark mode";
      }
    })();
  </script>
</body>
</html>
