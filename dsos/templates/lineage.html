{% extends "base.html" %}
{% block title %}Lineage: {{ art.title }} — DS Artifact OS{% endblock %}
{% block head %}
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  window.addEventListener("DOMContentLoaded", () => mermaid.initialize({ startOnLoad: true }));
</script>
{% endblock %}
{% block content %}
<p class="crumbs"><a href="/artifacts/{{ art.row_id }}">← {{ art.title }}</a></p>
<h1>Lineage: {{ art.title }}</h1>
<div class="mermaid">
{{ graph }}
</div>
{% endblock %}
